name: Security Scan (Trivy)

on:
  push:
    branches: [develop]
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # allow manual triggers

permissions:
  contents: read
  security-events: write  # for SARIF upload

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: provibackend
            context: ./provibackend
          - name: provifrontend
            context: ./ProViFrontend
          - name: redis
            context: ./provibackend/redis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t ${{ matrix.target.name }}:scan ${{ matrix.target.context }}

      - name: Trivy scan (table output, for humans)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.target.name }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'  # don't fail here, we want the SARIF step to run too
          trivyignores: .trivyignore

      - name: Trivy scan (SARIF, for GitHub Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.target.name }}:scan
          format: sarif
          output: trivy-${{ matrix.target.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.target.name }}.sarif
          category: trivy-${{ matrix.target.name }}

      - name: Fail on HIGH/CRITICAL (push only, not schedule)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.target.name }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
