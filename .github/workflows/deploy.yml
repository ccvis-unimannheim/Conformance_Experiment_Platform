name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Write .env
        env:
          SECRET_ENV: ${{ secrets.SECRET_ENV }}
        run: echo "$SECRET_ENV" > .env

      - name: Deploy
        run: docker compose up -d --build
