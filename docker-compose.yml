services:
  mongo:
    image: mongo
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    build:
      context: ./provibackend/redis
    container_name: redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  provibackend:
    build:
      context: ./provibackend
    container_name: provibackend
    restart: unless-stopped
    ports:
      - "127.0.0.1:1234:80"
    environment:
      LOCAL_DATABASE_USERNAME: ${MONGO_USERNAME:-root}
      LOCAL_DATABASE_PASSWORD: ${MONGO_PASSWORD:-example}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /srv/provi-data:/code/ProViBackend/data
      - ./provibackend/ProViBackend/new_input:/code/ProViBackend/new_input:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  provifrontend:
    build:
      context: ./ProViFrontend
      args:
        NEXT_PUBLIC_API_BASE: https://134.155.106.59/api
        NEXT_PUBLIC_API_URL: https://134.155.106.59/api
    container_name: provifrontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:22222:3000"
    environment:
      BACKEND_INTERNAL_URL: http://provibackend:80
    depends_on:
      - provibackend

  nginx:
    build:
      context: ./provibackend/nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /etc/ssl/ccvis-selfsigned:/etc/ssl/ccvis-selfsigned:ro
      - /etc/nginx-secrets/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - provibackend
      - provifrontend

volumes:
  mongo_data:
  redis_data:
